<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GTA 2D — Top Down</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#111; overflow:hidden; font-family:'Courier New',monospace; }
  canvas { display:block; cursor:crosshair; }
  #hud { position:absolute; top:10px; left:10px; color:#fff; pointer-events:none; text-shadow:2px 2px 0 #000; }
  #hud div { margin-bottom:4px; font-size:16px; }
  .big { font-size:28px; color:#ffd700; }
  #msg { position:absolute; top:15%; width:100%; text-align:center; color:#fff; font-size:34px; text-shadow:3px 3px 0 #000; pointer-events:none; opacity:0; transition:opacity .4s; }
  #help { position:absolute; bottom:8px; left:10px; color:#aaa; font-size:12px; text-shadow:1px 1px 0 #000; pointer-events:none; line-height:1.5; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="big" id="score">$ 0</div>
  <div>WANTED: <span id="stars"></span></div>
  <div id="health">HEALTH ██████████</div>
  <div id="ammo">AMMO ∞</div>
  <div id="clock">12:00 AM</div>
</div>
<div id="msg"></div>
<div id="help">WASD/Arrows: move · SHIFT: run · E: enter/exit car · Mouse: aim · Click: shoot · 1-4: weapon · Space: handbrake (car) · H: health pack</div>
<script>
"use strict";
/* ============================== SETUP ============================== */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
function resize(){ cv.width=innerWidth; cv.height=innerHeight; }
addEventListener('resize',resize); resize();

const WORLD = 3000;              // world is [-WORLD/2, WORLD/2] in x and y
const rand = (a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function angDiff(a,b){ let d=b-a; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI; return d; }

/* ============================== INPUT ============================== */
const keys={};
let mouse={x:0,y:0,down:false};
addEventListener('keydown',e=>{ keys[e.key.toLowerCase()]=true; if(['1','2','3','4'].includes(e.key)) player.weapon=+e.key-1; if(e.key===' ') e.preventDefault(); });
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
cv.addEventListener('mousemove',e=>{ mouse.x=e.clientX; mouse.y=e.clientY; });
cv.addEventListener('mousedown',e=>{ mouse.down=true; });
addEventListener('mouseup',()=>mouse.down=false);

/* ============================== WORLD GEN ============================== */
const buildings=[], roads=[], trees=[], props=[];
// road grid: horizontal & vertical strips
const ROAD_W=70, GRID=600;
for(let x=-WORLD/2+GRID; x<WORLD/2; x+=GRID) roads.push({x:x-ROAD_W/2,y:-WORLD/2,w:ROAD_W,h:WORLD,v:true});
for(let y=-WORLD/2+GRID; y<WORLD/2; y+=GRID) roads.push({x:-WORLD/2,y:y-ROAD_W/2,w:WORLD,h:ROAD_W,v:false});

// buildings in blocks (skip road strips)
function onRoad(x,y,pad=30){ return roads.some(r=> r.v ? x>r.x-pad&&x<r.x+r.w+pad : y>r.y-pad&&y<r.y+r.h+pad); }
const bColors=['#8a7f6c','#7d8591','#9c8b74','#6e7b8a','#a3907b','#77726b'];
let guard=0;
while(buildings.length<140 && guard++<4000){
  const w=rand(90,220), h=rand(90,220);
  const x=rand(-WORLD/2+80, WORLD/2-80-w), y=rand(-WORLD/2+80, WORLD/2-80-h);
  // reject if overlaps road or another building
  let ok=true;
  for(const r of roads){
    if(r.v ? x<r.x+r.w+25&&x+w>r.x-25 : y<r.y+r.h+25&&y+h>r.y-25){ ok=false; break; }
  }
  if(ok) for(const b of buildings){ if(x<b.x+b.w+30&&x+w>b.x-30&&y<b.y+b.h+30&&y+h>b.y-30){ok=false;break;} }
  if(!ok) continue;
  const c=bColors[(Math.random()*bColors.length)|0];
  buildings.push({x,y,w,h,c, roof:c, h2:rand(2,5)});
}
// trees & props in open spots
for(let i=0;i<260;i++){ const x=rand(-WORLD/2,WORLD/2), y=rand(-WORLD/2,WORLD/2); if(!onRoad(x,y,40)&&!buildings.some(b=>x>b.x-15&&x<b.x+b.w+15&&y>b.y-15&&y<b.y+b.h+15)) trees.push({x,y,r:rand(8,16)}); }
for(let i=0;i<40;i++){ const x=rand(-WORLD/2,WORLD/2), y=rand(-WORLD/2,WORLD/2); if(!onRoad(x,y,30)&&!buildings.some(b=>x>b.x-20&&x<b.x+b.w+20&&y>b.y-20&&y<b.y+b.h+20)) props.push({x,y,r:14,type:'crate'}); }

// collision list (buildings + props block movement)
const solids=[...buildings.map(b=>b), ...props];

/* ============================== VEHICLES ============================== */
const carColors=['#c0392b','#2980b9','#27ae60','#f1c40f','#8e44ad','#ecf0f1','#2c3e50','#e67e22'];
function makeCar(x,y,angle){ return {x,y,angle,vx:0,vy:0,w:44,h:22,color:carColors[(Math.random()*carColors.length)|0],type:'car',hp:100,drift:0}; }
const cars=[];
// park some near roads / spawn driving traffic
for(let i=0;i<26;i++){ const r=roads[(Math.random()*roads.length)|0]; let x,y; if(r.v){x=r.x+r.w/2+rand(-1,1)*45;y=rand(-WORLD/2+100,WORLD/2-100);} else {y=r.y+r.h/2+rand(-1,1)*45;x=rand(-WORLD/2+100,WORLD/2-100);} cars.push(makeCar(x,y,r.v?Math.PI/2:0)); }

/* ============================== PLAYER & WEAPONS ============================== */
const player={ x:0, y:0, angle:0, hp:100, money:0, weapon:0, inCar:null, walkAim:0 };
const weapons=[
  {name:'FISTS', dmg:12, rate:350, range:40, spread:0, bullet:null, sound:'thunk'},
  {name:'PISTOL', dmg:18, rate:260, spread:.05, bullet:{speed:900,life:1.2,color:'#fff'}},
  {name:'SHOTGUN',dmg:10, rate:700, pellets:6, spread:.35, bullet:{speed:800,life:.5,color:'#ffd'}},
  {name:'UZI', dmg:14, rate:90, spread:.12, bullet:{speed:1000,life:1,color:'#ff8'}},
];
let lastShot=0;

/* ============================== ENTITIES ============================== */
const peds=[], bullets=[], particles=[], pickups=[];
function makePed(x,y){ const t=(Math.random()*3)|0; return {x,y,angle:rand(0,7),hp:t===2?40:25,type:t,state:'wander',tx:x,ty:y,panic:false,shootCd:0,color:['#c9a','#8ac','#e63'][t],w:12,h:12}; }
for(let i=0;i<70;i++){ let x,y; do{x=rand(-WORLD/2+100,WORLD/2-100);y=rand(-WORLD/2+100,WORLD/2-100);}while(onRoad(x,y,20)); peds.push(makePed(x,y)); }
// money pickups
for(let i=0;i<30;i++) pickups.push({x:rand(-WORLD/2,WORLD/2),y:rand(-WORLD/2,WORLD/2),type:'money',v:50});
for(let i=0;i<8;i++) pickups.push({x:rand(-WORLD/2,WORLD/2),y:rand(-WORLD/2,WORLD/2),type:'health'});

/* ============================== POLICE / WANTED ============================== */
let wanted=0, wantedTimer=0;
function addWanted(n){ wanted=Math.min(5,wanted+n); wantedTimer=Math.max(wantedTimer,12); }
function spawnCop(){ const a=rand(0,Math.PI*2), d=600; const c=makeCar(player.x+Math.cos(a)*d, player.y+Math.sin(a)*d, -a+Math.PI/2); c.type='cop'; c.color='#1b3f8f'; c.hp=150; cars.push(c); }
function spawnCopPed(){ const a=rand(0,Math.PI*2), d=400; const p=makePed(player.x+Math.cos(a)*d, player.y+Math.sin(a)*d); p.type=2; p.panic=true; peds.push(p); }

/* ============================== FX / AUDIO ============================== */
let AC=null;
function beep(freq,dur,type='square',vol=.08){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(),g=AC.createGain(); o.type=type;o.frequency.value=freq;g.gain.value=vol; g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur); o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime+dur);}catch(e){} }
function boom(){ beep(90,.3,'sawtooth',.15); beep(40,.4,'triangle',.12); }
let cam={x:0,y:0,zoom:1};

/* ============================== MESSAGES ============================== */
const msgEl=document.getElementById('msg'); let msgT=0;
function showMsg(t,ms=2000){ msgEl.textContent=t; msgEl.style.opacity=1; clearTimeout(msgT); msgT=setTimeout(()=>msgEl.style.opacity=0,ms); }

/* ============================== UPDATE ============================== */
let last=performance.now();
function update(dt){
  // wanted decay
  if(wantedTimer>0) wantedTimer-=dt/1000; else if(wanted>0 && Math.random()<.02) wanted--;
  // spawn cops to match wanted level
  const cops=cars.filter(c=>c.type==='cop'&&c.hp>0).length;
  if(cops<wanted && Math.random()<.03){ spawnCop(); if(Math.random()<.5) spawnCopPed(); }

  /* ---- player (on foot or in car) ---- */
  if(player.inCar){
    const c=player.inCar;
    // driving controls
    let accel=0, steer=0;
    if(keys['w']||keys['arrowup']) accel=1;
    if(keys['s']||keys['arrowdown']) accel=-.6;
    if(keys['a']||keys['arrowleft']) steer=-1;
    if(keys['d']||keys['arrowright']) steer=1;
    const handbrake=keys[' '];
    const speed=Math.hypot(c.vx,c.vy);
    // forward vector
    const fx=Math.cos(c.angle), fy=Math.sin(c.angle);
    c.vx+=fx*accel*520*dt; c.vy+=fy*accel*520*dt;
    // drag & handbrake
    const drag=handbrake? 6 : 1.4;
    c.vx-=c.vx*drag*dt; c.vy-=c.vy*drag*dt;
    // steering proportional to speed
    if(speed>15) c.angle+=steer*(accel<0?-1:1)*2.4*dt*Math.min(1,speed/300);
    // collision with solids (slide)
    const nx=c.x+c.vx*dt, ny=c.y+c.vy*dt;
    let hit=false;
    for(const s of solids){ if(nx>s.x-14&&nx<s.x+s.w+14&&ny>s.y-14&&ny<s.y+s.h+14){hit=true;break;} }
    if(hit){ c.vx*=-.3; c.vy*=-.3; c.hp-=speed*.02; boom(); for(let i=0;i<6;i++)particles.push({x:c.x,y:c.y,vx:rand(-100,100),vy:rand(-100,100),life:.5,c:'#f80',r:3}); }
    else { c.x=nx; c.y=ny; }
    // world bounds
    c.x=clamp(c.x,-WORLD/2+40,WORLD/2-40); c.y=clamp(c.y,-WORLD/2+40,WORLD/2-40);
    player.x=c.x; player.y=c.y;
    if(c.hp<=0){ // car destroyed
      boom(); for(let i=0;i<40;i++)particles.push({x:c.x,y:c.y,vx:rand(-300,300),vy:rand(-300,300),life:1,c:['#f60','#f00','#ff0'][i%3],r:5});
      const idx=cars.indexOf(c); if(idx>-1)cars.splice(idx,1);
      player.inCar=null; wanted=Math.max(0,wanted-1); showMsg('CAR DESTROYED');
    }
  } else {
    // on foot
    let mx=0,my=0;
    if(keys['w']||keys['arrowup'])my--; if(keys['s']||keys['arrowdown'])my++;
    if(keys['a']||keys['arrowleft'])mx--; if(keys['d']||keys['arrowright'])mx++;
    const run=(keys['shift'])?1:0;
    const spd=run?260:140;
    if(mx||my){ const l=Math.hypot(mx,my); player.x+=mx/l*spd*dt; player.y+=my/l*spd*dt; }
    // aim at mouse (screen->world)
    const wx=mouse.x-cv.width/2+cam.x, wy=mouse.y-cv.height/2+cam.y;
    player.angle=Math.atan2(wy-player.y,wx-player.x);
    // collide solids
    for(const s of solids){ if(player.x>s.x-8&&player.x<s.x+s.w+8&&player.y>s.y-8&&player.y<s.y+s.h+8){
      // push out on smallest axis
      const ox=player.x-(s.x-8), ox2=(s.x+s.w+8)-player.x, oy=player.y-(s.y-8), oy2=(s.y+s.h+8)-player.y;
      const m=Math.min(ox,ox2,oy,oy2);
      if(m===ox)player.x=s.x-8; else if(m===ox2)player.x=s.x+s.w+8; else if(m===oy)player.y=s.y-8; else player.y=s.y+s.h+8;
    }}
    player.x=clamp(player.x,-WORLD/2+20,WORLD/2-20); player.y=clamp(player.y,-WORLD/2+20,WORLD/2-20);

    // enter nearest car (E)
    if(keys['e']){ let best=null,bd=50; for(const c of cars){ const d=dist(c,player); if(d<bd){bd=d;best=c;} } if(best){ player.inCar=best; showMsg('DRIVING'); keys['e']=false; } }

    // shooting
    const now=performance.now();
    if(mouse.down && now-lastShot>weapons[player.weapon].rate){
      lastShot=now;
      const w=weapons[player.weapon];
      if(w.bullet){
        beep(700+Math.random()*200,.08,'square',.05);
        for(let p=0;p<(w.pellets||1);p++){
          const a=player.angle+rand(-w.spread,w.spread);
          bullets.push({x:player.x+Math.cos(a)*16,y:player.y+Math.sin(a)*16,vx:Math.cos(a)*w.bullet.speed,vy:Math.sin(a)*w.bullet.speed,life:w.bullet.life,c:w.bullet.color,dmg:w.dmg,from:'player'});
        }
      } else {
        // melee
        beep(200,.1,'square',.06);
        for(const e of peds){ if(dist(e,player)<w.range && Math.abs(angDiff(player.angle,Math.atan2(e.y-player.y,e.x-player.x)))<1) hitPed(e,w.dmg); }
      }
    }
  }

  /* ---- traffic AI (cars) ---- */
  for(const c of cars){
    if(c===player.inCar||c.hp<=0) continue;
    const isCop=c.type==='cop';
    // simple: drive along axis toward a road line, avoid player crash
    let speed=isCop?260:150;
    if(isCop){
      // steer toward player
      const ta=Math.atan2(player.y-c.y,player.x-c.x);
      c.angle+=clamp(angDiff(c.angle,ta),-3*dt,3*dt);
      c.vx+=Math.cos(c.angle)*400*dt; c.vy+=Math.sin(c.angle)*400*dt;
    } else {
      // keep heading along nearest road direction
      const ta=c.angle;
      c.vx+=Math.cos(ta)*200*dt; c.vy+=Math.sin(ta)*200*dt;
    }
    c.vx-=c.vx*1.5*dt; c.vy-=c.vy*1.5*dt;
    const sp=Math.hypot(c.vx,c.vy); if(sp>speed){c.vx*=speed/sp;c.vy*=speed/sp;}
    // collide solids -> bounce & damage
    const nx=c.x+c.vx*dt, ny=c.y+c.vy*dt; let hit=false;
    for(const s of solids){ if(nx>s.x-12&&nx<s.x+s.w+12&&ny>s.y-12&&ny<s.y+s.h+12){hit=true;break;} }
    if(hit){ c.vx*=-.5;c.vy*=-.5; c.hp-=8; } else {c.x=nx;c.y=ny;}
    c.x=clamp(c.x,-WORLD/2+40,WORLD/2-40); c.y=clamp(c.y,-WORLD/2+40,WORLD/2-40);
    // ram player car
    if(player.inCar && dist(c,player.inCar)<38){ player.inCar.hp-=40*dt*10; c.vx+=rand(-50,50); }
  }

  /* ---- peds AI ---- */
  for(let i=peds.length-1;i>=0;i--){
    const e=peds[i];
    if(e.hp<=0){ // dead: drop money sometimes, fade out via particles
      if(Math.random()<.4) pickups.push({x:e.x,y:e.y,type:'money',v:25});
      for(let k=0;k<8;k++)particles.push({x:e.x,y:e.y,vx:rand(-60,60),vy:rand(-60,60),life:.8,c:'#900',r:3});
      peds.splice(i,1); continue;
    }
    const dP=dist(e,player);
    const cop = e.type===2;
    // panic if player near & wanted or shooting nearby
    if(!cop && (wanted>0 || dP<160)) { e.panic=true; }
    if(e.panic){
      // flee from player
      const fa=Math.atan2(e.y-player.y,e.x-player.x);
      e.angle=fa; e.tx=e.x+Math.cos(fa)*400; e.ty=e.y+Math.sin(fa)*400;
    } else if(Math.hypot(e.tx-e.x,e.ty-e.y)<20){
      const a=rand(0,7); e.tx=e.x+Math.cos(a)*rand(50,150); e.ty=e.y+Math.sin(a)*rand(50,150);
    }
    // move toward target
    const ta=Math.atan2(e.ty-e.y,e.tx-e.x);
    e.angle+=clamp(angDiff(e.angle,ta),-4*dt,4*dt);
    const spd=e.panic?180:60;
    let nx=e.x+Math.cos(e.angle)*spd*dt, ny=e.y+Math.sin(e.angle)*spd*dt;
    for(const s of solids){ if(nx>s.x-6&&nx<s.x+s.w+6&&ny>s.y-6&&ny<s.y+s.h+6){ e.tx=e.x-rand(50,150); e.ty=e.y-rand(50,150); nx=e.x; ny=e.y; } }
    e.x=nx; e.y=ny;
    // cops shoot player
    if(cop && dP<420){
      e.shootCd-=dt;
      if(e.shootCd<=0){ e.shootCd=.5+Math.random()*.8; const a=Math.atan2(player.y-e.y,player.x-e.x)+rand(-.15,.15); bullets.push({x:e.x,y:e.y,vx:Math.cos(a)*700,vy:Math.sin(a)*700,life:1.4,c:'#6cf',dmg:8,from:'cop'}); beep(500,.06,'square',.04); }
    }
  }

  /* ---- bullets ---- */
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i]; b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    let dead=b.life<=0;
    // hit solids
    if(!dead) for(const s of solids){ if(b.x>s.x&&b.x<s.x+s.w&&b.y>s.y&&b.y<s.y+s.h){ dead=true; break; } }
    // hit peds
    if(!dead && b.from==='player') for(const e of peds){ if(dist(e,b)<10){ hitPed(e,b.dmg); dead=true; break; } }
    // hit player (cops)
    if(!dead && b.from==='cop'){ if(dist(player,b)<12 && !player.inCar){ player.hp-=b.dmg; beep(150,.1,'sawtooth',.08); dead=true; } }
    // hit cars
    if(!dead) for(const c of cars){ if(dist(c,b)<22){ c.hp-=b.dmg; dead=true; break; } }
    if(dead){ for(let k=0;k<3;k++)particles.push({x:b.x,y:b.y,vx:rand(-80,80),vy:rand(-80,80),life:.3,c:b.c,r:2}); bullets.splice(i,1); }
  }

  /* ---- particles ---- */
  for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; if(p.life<=0)particles.splice(i,1); }

  /* ---- pickups ---- */
  for(let i=pickups.length-1;i>=0;i--){ const k=pickups[i]; if(dist(k,player)<24){ if(k.type==='money'){player.money+=k.v; beep(900,.08,'square',.05);} else { player.hp=Math.min(100,player.hp+30); beep(600,.15,'sine',.06);} pickups.splice(i,1); } }

  /* ---- camera ---- */
  const tz=player.inCar? .85 : 1;
  cam.zoom+=(tz-cam.zoom)*dt*4;
  cam.x+= (player.x-cam.x)*Math.min(1,dt*6);
  cam.y+= (player.y-cam.y)*Math.min(1,dt*6);

  /* ---- death ---- */
  if(player.hp<=0){ showMsg('WASTED'); setTimeout(()=>{ player.hp=100; player.money=Math.max(0,player.money-200); wanted=0; player.x=0;player.y=0; player.inCar=null; },2500); }
}

function hitPed(e,dmg){ e.hp-=dmg; e.panic=true; if(e.hp<=0){ addWanted(1); player.money+=5; beep(120,.15,'sawtooth',.08); } else beep(300,.05,'square',.04); }

/* ============================== RENDER ============================== */
function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  // ground
  ctx.fillStyle='#4a7c3f'; ctx.fillRect(0,0,cv.width,cv.height);
  const z=cam.zoom;
  ctx.save();
  ctx.translate(cv.width/2,cv.height/2); ctx.scale(z,z); ctx.translate(-cam.x,-cam.y);

  // roads
  for(const r of roads){
    ctx.fillStyle='#3a3a3a'; ctx.fillRect(r.x,r.y,r.w,r.h);
    // center dashes
    ctx.strokeStyle='#d4c465'; ctx.lineWidth=3; ctx.setLineDash([20,18]);
    ctx.beginPath();
    if(r.v){ ctx.moveTo(r.x+r.w/2,-WORLD/2); ctx.lineTo(r.x+r.w/2,WORLD/2); } else { ctx.moveTo(-WORLD/2,r.y+r.h/2); ctx.lineTo(WORLD/2,r.y+r.h/2); }
    ctx.stroke(); ctx.setLineDash([]);
  }
  // trees (shadow under, canopy)
  for(const t of trees){ ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.arc(t.x+4,t.y+4,t.r,0,7); ctx.fill(); ctx.fillStyle='#2e6b2a'; ctx.beginPath(); ctx.arc(t.x,t.y,t.r,0,7); ctx.fill(); }
  // props crates
  for(const p of props){ ctx.fillStyle='#8a6d3b'; ctx.fillRect(p.x-14,p.y-14,28,28); ctx.strokeStyle='#5c4622'; ctx.strokeRect(p.x-14,p.y-14,28,28); }
  // buildings (with fake height: offset shadow + roof)
  for(const b of buildings){
    const off=b.h2*3;
    ctx.fillStyle='rgba(0,0,0,.3)'; ctx.fillRect(b.x+off,b.y+off,b.w,b.h);
    ctx.fillStyle=shade(b.c,-40); ctx.fillRect(b.x+off/2,b.y+off/2,b.w,b.h);
    ctx.fillStyle=b.roof; ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.strokeRect(b.x,b.y,b.w,b.h);
    // roof detail
    ctx.fillStyle='rgba(255,255,255,.12)'; ctx.fillRect(b.x+8,b.y+8,b.w-16,b.h-16);
  }
  // pickups
  for(const k of pickups){ const bob=Math.sin(performance.now()/300+k.x)*3; if(k.type==='money'){ ctx.fillStyle='#4cff5e'; ctx.font='bold 16px monospace'; ctx.fillText('$',k.x-4,k.y+bob); } else { ctx.fillStyle='#ff5555'; ctx.fillRect(k.x-8,k.y-8+bob,16,16); ctx.fillStyle='#fff'; ctx.fillRect(k.x-2,k.y-6+bob,4,12); ctx.fillRect(k.x-6,k.y-2+bob,12,4); } }
  // cars
  for(const c of cars) drawCar(c);
  // peds
  for(const e of peds){ ctx.save(); ctx.translate(e.x,e.y); ctx.rotate(e.angle); ctx.fillStyle='rgba(0,0,0,.3)'; ctx.fillRect(-6,-5,12,10); ctx.fillStyle=e.color; ctx.fillRect(-7,-5,14,10); // body
    ctx.fillStyle='#e8c9a0'; ctx.beginPath(); ctx.arc(4,0,4,0,7); ctx.fill(); // head
    if(e.type===2){ ctx.fillStyle='#fff'; ctx.font='8px monospace'; ctx.fillText('COP',-10,-8);} ctx.restore(); }
  // player (on foot)
  if(!player.inCar){ ctx.save(); ctx.translate(player.x,player.y); ctx.rotate(player.angle);
    ctx.fillStyle='rgba(0,0,0,.3)'; ctx.fillRect(-6,-5,12,10);
    ctx.fillStyle='#fff'; ctx.fillRect(-7,-5,14,10); // arms
    ctx.fillStyle='#e8c9a0'; ctx.beginPath(); ctx.arc(4,0,4,0,7); ctx.fill();
    // gun
    ctx.fillStyle='#222'; ctx.fillRect(6,-2,14,3);
    ctx.restore(); }
  // bullets
  for(const b of bullets){ ctx.strokeStyle=b.c; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(b.x-b.vx*.02,b.y-b.vy*.02); ctx.stroke(); }
  // particles
  for(const p of particles){ ctx.globalAlpha=Math.max(0,p.life*2); ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); }
  ctx.globalAlpha=1;
  ctx.restore();

  /* ---- HUD ---- */
  const stars='★'.repeat(wanted)+'☆'.repeat(5-wanted);
  document.getElementById('stars').textContent=stars;
  document.getElementById('score').textContent='$ '+player.money;
  document.getElementById('health').textContent='HEALTH '+'█'.repeat(Math.ceil(player.hp/10))+'░'.repeat(10-Math.ceil(player.hp/10));
  document.getElementById('ammo').textContent=(player.inCar?'IN VEHICLE':'WEAPON: '+weapons[player.weapon].name);
  // clock (game time ~ real 1s = 1 min)
  const t=new Date(); let h=t.getHours(),m=t.getMinutes()+ (performance.now()/1000|0)%60; if(m>59){m-=60;h=(h+1)%24;} const ap=h>=12?'PM':'AM'; const hh=((h%12)||12);
  document.getElementById('clock').textContent=hh+':'+String(m).padStart(2,'0')+' '+ap;

  // minimap
  const mm=150, mx=cv.width-mm-12, my=12;
  ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(mx,my,mm,mm);
  ctx.strokeStyle='#fff'; ctx.strokeRect(mx,my,mm,mm);
  const sc=mm/WORLD;
  function mp(x,y){ return [mx+(x+WORLD/2)*sc, my+(y+WORLD/2)*sc]; }
  // roads on map
  ctx.fillStyle='#666'; for(const r of roads) ctx.fillRect(mx+(r.x+WORLD/2)*sc,my+(r.y+WORLD/2)*sc,r.w*sc,r.h*sc);
  for(const c of cars){ const [px,py]=mp(c.x,c.y); ctx.fillStyle=c.type==='cop'?'#4af':'#ff0'; ctx.fillRect(px-1.5,py-1.5,3,3); }
  for(const e of peds){ if(e.type===2) continue; const [px,py]=mp(e.x,e.y); ctx.fillStyle='#8f8'; ctx.fillRect(px-1,py-1,2,2); }
  const [ppx,ppy]=mp(player.x,player.y); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ppx,ppy,3,0,7); ctx.fill();
}

function shade(hex,amt){ const n=parseInt(hex.slice(1),16); let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt; r=clamp(r,0,255);g=clamp(g,0,255);b=clamp(b,0,255); return `rgb(${r},${g},${b})`; }
function drawCar(c){ ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.angle);
  ctx.fillStyle='rgba(0,0,0,.3)'; ctx.fillRect(-c.w/2+3,-c.h/2+3,c.w,c.h);
  ctx.fillStyle=c.color; ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);
  // windshield & roof
  ctx.fillStyle='rgba(20,30,50,.8)'; ctx.fillRect(c.w/2-14,-c.h/2+3,6,c.h-6); ctx.fillRect(-c.w/2+8,-c.h/2+3,6,c.h-6);
  ctx.fillStyle=shade(c.color,40); ctx.fillRect(-c.w/2+10,-c.h/2+5,c.w-20,c.h-10);
  // headlights
  ctx.fillStyle='#ffe'; ctx.fillRect(c.w/2-3,-c.h/2+2,3,4); ctx.fillRect(c.w/2-3,c.h/2-6,3,4);
  if(c.type==='cop'){ ctx.fillStyle='#fff'; ctx.font='bold 9px monospace'; ctx.fillText('COP',-10,3); }
  // damage smoke
  if(c.hp<50 && Math.random()<.3) particles.push({x:c.x,y:c.y,vx:rand(-20,20),vy:rand(-40,-10),life:.8,c:'#555',r:4});
  ctx.restore(); }

/* ============================== LOOP ============================== */
function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now; update(dt); draw(); requestAnimationFrame(loop); }
showMsg('WELCOME TO LIBERTY CITY — go make some money');
requestAnimationFrame(t=>{last=t;loop(t);});
</script>
</body>
</html>
